{{define "head"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} &middot; Curator admin</title>
<style>
  :root {
    color-scheme: light;
    --canvas: #f5f5f3;
    --surface: #fff;
    --surface-muted: #ececea;
    --ink: #202124;
    --muted: #6d6f73;
    --line: #dcdcd9;
    --accent: #3157d5;
    --accent-hover: #2444b6;
    --accent-soft: #e8edff;
    --danger: #b43b34;
    --reset-soft: #f1f2ef;
    --danger-soft: #fff1ef;
    --shadow: 0 1px 2px #2021240a, 0 8px 24px #2021240a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--canvas); color: var(--ink); font: 15px/1.55 "Avenir Next", Avenir, "Trebuchet MS", sans-serif; }
  header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 2rem; min-height: 64px; padding: .65rem max(1.25rem, calc((100% - 1120px) / 2)); background: #fffefaed; border-bottom: 1px solid var(--line); backdrop-filter: blur(14px); }
  header .brand { display: flex; align-items: center; gap: .65rem; color: var(--ink); font-family: "Avenir Next", Avenir, sans-serif; font-size: 1.15rem; font-weight: 700; text-decoration: none; }
  header .brand::before { content: "C"; display: grid; width: 30px; height: 30px; place-items: center; color: #fff; background: var(--ink); border-radius: 6px; font: 700 1rem/1 "Avenir Next", Avenir, sans-serif; }
  header nav { display: flex; align-items: center; gap: .25rem; margin-left: auto; }
  header nav a { padding: .45rem .65rem; color: var(--muted); font-size: .9rem; font-weight: 600; text-decoration: none; border-radius: 5px; }
  header nav a:hover { color: var(--ink); background: var(--surface-muted); }
  header nav form { margin-left: .35rem; }
  main { width: min(1120px, 100%); margin: 0 auto; padding: 2.25rem 1.25rem 5rem; }
  h1, h2, h3 { font-family: "Avenir Next", Avenir, "Trebuchet MS", sans-serif; font-weight: 700; letter-spacing: 0; }
  h1 { margin: 0 0 .4rem; font-size: clamp(2rem, 5vw, 2.8rem); line-height: 1.1; }
  h2 { margin: 2.5rem 0 .8rem; font-size: 1.45rem; }
  h3 { font-size: 1.15rem; }
  p { color: var(--muted); }
  a { color: var(--accent); text-underline-offset: 3px; }
  a:hover { color: var(--accent-hover); }
  code { padding: .12rem .35rem; background: var(--surface-muted); border-radius: 4px; }
  .page-head { display: flex; align-items: end; justify-content: space-between; gap: 1.5rem; margin-bottom: 1.5rem; }
  .page-head p { max-width: 680px; margin: .5rem 0 0; }
  .back-link { display: inline-block; margin-bottom: 1rem; color: var(--muted); font-size: .85rem; font-weight: 700; text-decoration: none; }
  .breadcrumbs { display: flex; flex-wrap: wrap; gap: .25rem .45rem; align-items: center; margin-bottom: .8rem; color: var(--muted); font-size: .8rem; font-weight: 650; }
  .breadcrumbs a { color: var(--muted); text-decoration: none; }
  .breadcrumbs a:hover { color: var(--accent); }
  .meta-row { display: flex; flex-wrap: wrap; gap: .45rem 1rem; align-items: center; margin: .7rem 0 0; color: var(--muted); font-size: .85rem; }
  .meta-row p { margin: 0; }
  .flash { width: min(1120px, calc(100% - 2.5rem)); margin: 1rem auto 0; padding: .75rem 1rem; color: #2444a0; background: var(--accent-soft); border: 1px solid #b9c7f8; border-radius: 6px; }
  table { width: 100%; overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-collapse: separate; border-spacing: 0; border-radius: 8px; box-shadow: var(--shadow); }
  th, td { padding: .8rem 1rem; text-align: left; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); background: #fafaf7; font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  tr:last-child td { border-bottom: 0; }
  tbody tr:hover, table tr:not(:first-child):hover { background: #f8faf8; }
  .gallery-tree-title { display: flex; align-items: center; gap: .45rem; padding-left: calc(var(--gallery-depth) * 1.35rem); }
  .gallery-tree-toggle, .gallery-tree-spacer { flex: 0 0 28px; width: 28px; }
  .gallery-tree-toggle { position: relative; min-height: 28px; padding: 0; color: var(--muted); background: transparent; border-color: transparent; }
  .gallery-tree-toggle::before { content: ""; position: absolute; top: 9px; left: 8px; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(-45deg); transition: transform .15s; }
  .gallery-tree-toggle[aria-expanded="true"]::before { transform: rotate(45deg); }
  .gallery-tree-toggle:hover { color: var(--ink); background: var(--surface-muted); border-color: var(--line); }
  .gallery-tree-spacer { height: 28px; }
  form.inline { display: inline; }
  input, select, textarea, button { min-height: 40px; border: 1px solid #c9cdc7; border-radius: 5px; font: inherit; }
  input, select, textarea { max-width: 100%; padding: .55rem .7rem; color: var(--ink); background: var(--surface); }
  select { padding: .6rem 2rem .6rem .75rem; }
  input:not([type="checkbox"]):not([type="file"]), select { width: min(100%, 460px); }
  textarea { width: 100%; resize: vertical; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: 3px solid #3157d526; }
  input[type="checkbox"] { width: 17px; min-height: 17px; accent-color: var(--accent); vertical-align: -.2em; }
  input[type="file"] { width: min(100%, 520px); padding: .45rem; background: var(--surface-muted); }
  input[type="file"]::file-selector-button { margin-right: 1.1rem; padding: .35rem .7rem; border: 0; border-radius: 4px; background: var(--surface); cursor: pointer; }
  button { padding: .5rem .85rem; color: #fff; background: var(--accent); border-color: var(--accent); font-weight: 650; cursor: pointer; }
  button:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  button:disabled { color: var(--muted); background: var(--surface-muted); border-color: var(--line); cursor: default; }
  header button, .item-actions button { min-height: 34px; padding: .35rem .65rem; font-size: .85rem; }
  header .secondary button, .item-actions button { color: var(--ink); background: transparent; border-color: var(--line); }
  header .secondary button:hover, .item-actions button:hover { background: var(--surface-muted); }
  button.danger { color: var(--danger); background: transparent; border-color: #ddb8b4; }
  button.danger:hover { color: #fff; background: var(--danger); border-color: var(--danger); }
  .field { display: block; margin: 1rem 0; color: var(--ink); }
  .field > span { display: block; margin-bottom: .3rem; color: var(--muted); font-size: .8rem; font-weight: 700; }
  .card { max-width: 760px; margin: 1rem 0; padding: 1.25rem; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
  .card h2:first-child { margin-top: 0; }
  .dashboard-actions { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, .65fr); gap: 1.25rem; align-items: start; }
  .dashboard-actions section h2 { margin-top: 2rem; }
  .dashboard-actions .card { width: 100%; margin-top: 0; }
  .toolbar { display: flex; flex-wrap: wrap; gap: .75rem 1rem; align-items: end; max-width: none; }
  .toolbar form { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin: 0 !important; }
  .toolbar label { color: var(--muted); font-size: .82rem; font-weight: 700; }
  .toolbar select { width: auto; min-width: 130px; margin-left: .25rem; }
  .login-card { max-width: 420px; margin-top: 1.5rem; }
  .login-card input { width: 100% !important; }
  .settings-tabs { display: flex; gap: .25rem; margin: 0 0 1.25rem; border-bottom: 1px solid var(--line); }
  .settings-tabs a { padding: .65rem .85rem; color: var(--muted); font-size: .85rem; font-weight: 700; text-decoration: none; border-bottom: 2px solid transparent; }
  .settings-tabs a:hover { color: var(--ink); }
  .settings-tabs a[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); }
  .settings-card h2 { padding-top: 1.5rem; border-top: 1px solid var(--line); }
  .settings-card h2:first-of-type { padding-top: 0; border-top: 0; }
  .settings-save-row { position: sticky; top: 64px; z-index: 5; display: flex; align-items: center; gap: .8rem; margin: -1.25rem -1.25rem 1.25rem; padding: .75rem 1.25rem; background: var(--surface); border-bottom: 1px solid var(--line); border-radius: 8px 8px 0 0; transition: background .15s, box-shadow .15s; }
  .settings-save-row[data-dirty="true"] { background: var(--accent-soft); box-shadow: 0 5px 14px #20212414; }
  .settings-save-status { color: var(--muted); font-size: .8rem; font-weight: 650; }
  .settings-save-status::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: .4rem; background: var(--line); border-radius: 50%; vertical-align: .05em; }
  .settings-save-status[data-dirty="true"] { color: var(--accent); }
  .settings-save-status[data-dirty="true"]::before { background: var(--accent); }
  .settings-form { max-width: 960px; }
  .settings-form > .settings-save-row { width: 100%; margin: 0 0 1rem; border: 1px solid var(--line); border-radius: 7px; box-shadow: var(--shadow); }
  .settings-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
  .settings-panel { min-width: 0; padding: 1.25rem; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
  .settings-panel-wide { grid-column: 1 / -1; }
  .settings-panel-heading { margin-bottom: 1rem; padding-bottom: .8rem; border-bottom: 1px solid var(--line); }
  .settings-panel-heading h2, .settings-action-card h2 { margin: 0; font-size: 1.08rem; }
  .settings-panel-heading p, .settings-action-card p { margin: .25rem 0 0; font-size: .82rem; }
  .settings-panel .field { margin: .8rem 0; }
  .settings-panel input:not([type="checkbox"]), .settings-panel select { width: 100%; }
  .settings-field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .85rem; }
  .settings-field-grid .field { margin: 0; }
  .settings-field-grid-copyright { grid-template-columns: minmax(0, 1fr) 150px; }
  .field-help { margin: .55rem 0 0; color: var(--muted); font-size: .78rem; }
  .choice-list { display: grid; gap: .25rem; }
  .choice-row { display: flex; gap: .65rem; align-items: flex-start; padding: .65rem; border-radius: 5px; cursor: pointer; }
  .choice-row:hover { background: var(--surface-muted); }
  .choice-row input { flex: 0 0 auto; margin-top: .2rem; }
  .choice-row span, .choice-row strong, .choice-row small { display: block; }
  .choice-row strong { font-size: .88rem; }
  .choice-row small { margin-top: .08rem; color: var(--muted); font-size: .75rem; }
  .settings-action-card { display: grid; gap: 1rem; }
  .settings-action-narrow { max-width: 470px; margin-top: 1rem; }
  .settings-wide-card { width: 100%; max-width: 960px; }
  .override-reset-list { display: grid; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .override-reset-row, .override-reset-all { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .75rem; }
  .override-reset-row + .override-reset-row, .override-reset-all { border-top: 1px solid var(--line); }
  .override-reset-row span, .override-reset-row strong, .override-reset-row small { display: block; }
  .override-reset-row strong { font-size: .86rem; }
  .override-reset-row small, .override-reset-all span { margin-top: .08rem; color: var(--muted); font-size: .75rem; }
  .override-reset-row button, .override-reset-all button { flex: 0 0 auto; }
  .override-reset-all { background: var(--surface-muted); }
  .access-admin-card .settings-field-grid { margin: 1rem 0; }
  .access-users-heading { max-width: 960px; margin-bottom: .75rem; }
  .access-users-heading p { margin: .2rem 0 0; }
  .access-user-form { margin-top: 1rem; }
  .access-user-form h3 { margin: 0 0 .75rem; }
  .input-action { display: flex !important; max-width: 680px; align-items: stretch; gap: .5rem; }
  .input-action input { flex: 1; min-width: 0; font-family: ui-monospace, monospace; }
  .input-action button { flex: 0 0 auto; }
  .grid-choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: .5rem; margin: .6rem 0 1rem; }
  .grid-choices label { padding: .5rem; background: var(--canvas); border-radius: 4px; overflow-wrap: anywhere; }
  .xmp-profiles { margin-top: 2rem; }
  .xmp-profiles > p { margin: -.25rem 0 1rem; }
  .mapping-heading { display: flex; align-items: end; justify-content: space-between; gap: 1rem; margin: 2rem 0 .75rem; }
  .mapping-heading h3, .mapping-heading p { margin: 0; }
  .mapping-heading p { font-size: .82rem; }
  .mapping-list { display: grid; gap: .65rem; margin-bottom: 1.25rem; }
  .mapping-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 40px; gap: .65rem; align-items: end; }
  .mapping-row label { min-width: 0; }
  .mapping-row label > span { display: block; margin-bottom: .25rem; color: var(--muted); font-size: .72rem; font-weight: 700; }
  .mapping-row input { width: 100% !important; }
  .mapping-evidence { display: flex; grid-column: 1 / -1; align-items: center; justify-content: space-between; gap: .75rem; margin-top: -.25rem; color: var(--muted); font-size: .76rem; }
  .mapping-evidence button { flex: 0 0 auto; padding: .35rem .55rem; font-size: .72rem; }
  button.secondary-button { color: var(--ink); background: var(--surface); border-color: var(--line); }
  button.secondary-button:hover { background: var(--surface-muted); border-color: var(--line); }
  .mapping-remove { width: 40px; padding: 0; color: var(--muted); background: transparent; border-color: var(--line); font-size: 1.35rem; }
  .mapping-remove:hover { color: var(--danger); background: transparent; border-color: #ddb8b4; }
  .metadata-rescan { display: flex; max-width: 900px; align-items: center; justify-content: space-between; gap: 1rem; padding: .75rem 0; }
  .metadata-rescan p { margin: 0; }
  .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 1.15rem .7rem; }
  .thumbs figure { position: relative; overflow: visible; margin: 0; }
  .thumbs img { display: block; width: 100%; height: 100%; object-fit: contain; background: var(--surface-muted); }
  .item form { display: grid; grid-template-columns: 1fr auto; gap: .5rem; align-items: center; }
  .item form input[type="text"] { flex: 1 1 100%; }
  .item form label { grid-column: 1 / -1; }
  .item-preview { position: relative; display: block; width: 100%; min-height: 0; aspect-ratio: 4 / 3; overflow: hidden; padding: 0; background: var(--surface-muted); border: 0; border-radius: 3px; cursor: zoom-in; }
  .item-preview:hover { background: var(--surface-muted); border-color: transparent; }
  .item-preview:focus-visible { outline: 3px solid #3157d540; outline-offset: 2px; }
  .item-badges { position: absolute; top: .45rem; left: .45rem; display: flex; gap: .3rem; align-items: center; pointer-events: none; }
  .item-marker { display: inline-block; padding: .12rem .38rem; color: #fff; background: #202124cc; border-radius: 3px; font-size: .62rem; font-weight: 700; line-height: 1.45; text-transform: capitalize; box-shadow: 0 1px 3px #0003; }
  .item-marker[hidden], .cover-label[hidden] { display: none; }
  .item-hover-title { position: absolute; right: .45rem; bottom: .45rem; left: .45rem; overflow: hidden; padding: .22rem .4rem; color: #fff; background: #202124cc; border-radius: 3px; font-size: .66rem; font-weight: 650; line-height: 1.35; text-align: left; text-overflow: ellipsis; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .15s ease; }
  .item:hover .item-hover-title, .item-preview:focus-visible .item-hover-title { opacity: 1; }
  .drag-handle { position: absolute; top: .45rem; right: .45rem; display: none; width: 30px; height: 30px; place-items: center; color: #fff; background: #202124c9; border: 1px solid #ffffff42; border-radius: 4px; font-size: 1rem; line-height: 1; box-shadow: 0 1px 3px #0003; pointer-events: none; }
  #photo-list.is-arranging .drag-handle { display: grid; }
  #photo-list.is-arranging .item-preview { cursor: grab; touch-action: none; }
  #photo-list.is-arranging .item-preview:active { cursor: grabbing; }
  #photo-list.is-arranging .item-hover-title { display: none; }
  .item.is-dragging { z-index: 2; opacity: .45; }
  .badge { display: inline-block; padding: .15rem .5rem; color: #2949ae; background: var(--accent-soft); border: 1px solid #c4cef2; border-radius: 999px; font-size: .72rem; font-weight: 700; }
  .progress { height: 7px; overflow: hidden; margin: .7rem 0; background: var(--surface-muted); border-radius: 99px; }
  .progress-bar { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .build-status { position: relative; }
  .build-status-heading { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .publish-steps { display: flex; gap: 1rem; margin-top: .6rem; color: var(--muted); font-size: .75rem; font-weight: 700; }
  .publish-steps span { display: inline-flex; align-items: center; gap: .35rem; }
  .publish-steps span::before { width: 7px; height: 7px; content: ""; background: var(--line); border-radius: 50%; }
  .publish-steps span[data-state="running"] { color: var(--ink); }
  .publish-steps span[data-state="running"]::before { background: var(--accent); }
  .publish-steps span[data-state="complete"]::before { background: var(--ink); }
  .publish-steps span[data-state="failed"] { color: var(--danger); }
  .publish-steps span[data-state="failed"]::before { background: var(--danger); }
  .publish-rsync-detail { margin-top: -.25rem; color: var(--muted); font-size: .78rem; }
  .rsync-preview { align-items: start; }
  .rsync-preview-result { width: 100%; grid-column: 1 / -1; padding-top: .8rem; border-top: 1px solid var(--line); }
  .rsync-preview-result h3 { margin: 0 0 .5rem; font-size: .82rem; }
  .rsync-preview-result pre { max-height: 320px; overflow: auto; margin: 0; padding: .75rem; background: var(--surface-muted); border-radius: 5px; font-size: .75rem; line-height: 1.5; white-space: pre-wrap; }
  .form-error { color: var(--danger); }
  .build-dismiss { width: 32px; min-height: 32px; padding: 0; color: var(--muted); background: transparent; border-color: transparent; font-size: 1.25rem; }
  .build-dismiss:hover { color: var(--ink); background: var(--surface-muted); border-color: var(--line); }
  .subgalleries { padding: 0; list-style: none; }
  .subgalleries li { padding: .65rem 0; border-bottom: 1px solid var(--line); }
  .gallery-page-head { align-items: center; margin-bottom: .75rem; }
  .gallery-settings { margin: 0 0 1.5rem; }
  .settings-links { display: flex; align-items: center; gap: .65rem; min-width: 0; }
  .settings-links { justify-content: flex-end; font-size: .78rem; white-space: nowrap; }
  .settings-links a { color: var(--accent); font-weight: 650; text-decoration: none; }
  .settings-links a:hover { color: var(--accent-hover); }
  .visibility-note { padding: .12rem .4rem; color: var(--muted); background: var(--surface-muted); border-radius: 3px; font-size: .7rem; font-weight: 700; }
  .settings-row { display: flex; gap: .5rem; align-items: end; padding: 0 0 .75rem; }
  .settings-row .public-url-row { min-height: 36px; margin-left: auto; }
  .setting-control { min-width: 0; }
  .setting-control > span, .settings-row form > label > span, .add-block label > span { display: block; margin-bottom: .25rem; color: var(--muted); font-size: .7rem; font-weight: 700; }
  .listing-setting select { width: 150px; height: 36px; min-height: 36px; padding: .35rem .55rem; }
  .listing-setting select, .listing-setting option { text-transform: capitalize; }
  .toggle-form { display: flex; height: 36px; align-items: center; white-space: nowrap; }
  .toggle-form label { font-size: .82rem; font-weight: 600; }
  .order-setting { min-width: 0; }
  .order-setting form { display: grid; grid-template-columns: minmax(170px, 1fr) minmax(200px, 1.15fr); gap: .75rem; }
  .gallery-options { border: 1px solid var(--line); border-radius: 6px; }
  .gallery-options > summary { display: flex; align-items: center; gap: .6rem; padding: .7rem .85rem; cursor: pointer; list-style: none; }
  .gallery-options > summary::-webkit-details-marker { display: none; }
  .gallery-options > summary::before { content: ""; width: 7px; height: 7px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; }
  .gallery-options[open] > summary::before { transform: rotate(45deg); }
  .gallery-options[open] > summary { border-bottom: 1px solid var(--line); }
  .gallery-options-panel { padding: 1.1rem 1rem 1.25rem; }
  .gallery-option-section { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 1.5rem; min-width: 0; align-items: start; }
  .gallery-option-section + .gallery-option-section { margin-top: 1.5rem; }
  .gallery-option-section h3 { margin: .45rem 0 0; font-size: .8rem; }
  .option-section-content { min-width: 0; }
  .gallery-options-panel .setting-control > span { display: block; margin: 1rem 0 .5rem; color: var(--muted); font-size: .7rem; font-weight: 700; }
  .gallery-options-panel form { display: grid; gap: .75rem; }
  .gallery-options-panel form label > span, .identity-setting > label > span { display: block; margin-bottom: .4rem; color: var(--muted); font-size: .7rem; font-weight: 700; }
  .gallery-options-panel select { width: 100%; }
  .gallery-options-panel input, .gallery-options-panel select { height: 40px; min-height: 40px; }
  .identity-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; }
  .identity-grid > * { min-width: 0; }
  .identity-url { grid-column: 2 / 4; }
  .identity-setting > label, .identity-setting form label { display: block; }
  .identity-setting input { width: 100%; }
  .option-label-row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin-bottom: .4rem; color: var(--muted); font-size: .7rem; font-weight: 700; }
  .setting-hint { font-weight: 500; }
  .identity-setting .url-name-form { grid-template-columns: minmax(0, 1fr) auto; gap: .6rem; align-items: start; }
  .url-name-form .url-format-note, .url-name-form .url-warning { grid-column: 1 / -1; }
  .url-name-form .url-format-note { margin-top: -.1rem; }

  @media (prefers-color-scheme: dark) {

<body>
<header>
  <a class="brand" href="{{.BasePath}}/">Curator</a>
  <nav>
    <a href="{{.BasePath}}/">Galleries</a>
    <a href="{{.BasePath}}/access">Access</a>
    <a href="{{.BasePath}}/settings">Settings</a>
    <form class="inline" method="post" action="{{.BasePath}}/build"><input type="hidden" name="_csrf" value="{{.CSRF}}"><button>Publish site</button></form>
    {{if and .AuthEnabled .Authed}}<form class="inline secondary" method="post" action="{{.BasePath}}/logout"><input type="hidden" name="_csrf" value="{{.CSRF}}"><button>Sign out</button></form>{{end}}
  </nav>
</header>
{{if .Flash}}<div class="flash">{{.Flash}}</div>{{end}}
<main>
{{end}}

{{define "foot"}}</main>
<script>
(function () {
  var states = [];
  var allowNavigation = false;
  function hasUnsavedChanges() {
    return states.some(function (state) { return state.dirty && !state.submitting; });
  }
  function confirmNavigation() {
    if (!hasUnsavedChanges()) return true;
    if (!confirm("You have unsaved settings changes. Leave without saving?")) return false;
    allowNavigation = true;
    return true;
  }
  function values(form) {
    return new URLSearchParams(new FormData(form)).toString();
  }
  document.querySelectorAll("[data-dirty-form]").forEach(function (form) {
    var button = form.querySelector("[data-save-button]");
    var status = form.querySelector("[data-save-status]");
    var row = status.closest(".settings-save-row");
    var state = { form: form, initial: values(form), dirty: false, submitting: false };
    states.push(state);
    function update() {
      state.dirty = values(form) !== state.initial;
      button.disabled = !state.dirty;
      status.textContent = state.dirty ? "Unsaved changes" : "No unsaved changes";
      status.dataset.dirty = String(state.dirty);
      row.dataset.dirty = String(state.dirty);
    }
    form.addEventListener("input", update);
    form.addEventListener("change", update);
    var dynamicFields = form.querySelector("#mapping-list");
    if (dynamicFields) {
      new MutationObserver(update).observe(dynamicFields, { childList: true, subtree: true });
    }
    form.addEventListener("submit", function () {
      state.submitting = true;
      button.disabled = true;
      status.textContent = "Saving...";
      status.dataset.dirty = "false";
      row.dataset.dirty = "false";
    });
    update();
  });
  document.addEventListener("click", function (event) {
    var link = event.target.closest("a[href]");
    if (!link || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey ||
        link.target === "_blank" || link.hasAttribute("download")) return;
    var destination = new URL(link.href, location.href);
    if (destination.pathname === location.pathname && destination.search === location.search && destination.hash) return;
    if (!confirmNavigation()) event.preventDefault();
  });
  document.addEventListener("submit", function (event) {
    if (event.target.matches("[data-dirty-form]") || confirmNavigation()) return;
    event.preventDefault();
  });
  window.addEventListener("beforeunload", function (event) {
    if (allowNavigation || !hasUnsavedChanges()) return;
    event.preventDefault();
    event.returnValue = "";
  });
})();
</script>
</body>
