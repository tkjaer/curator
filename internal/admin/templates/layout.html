{{define "head"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} &middot; Curator admin</title>
<style>
  :root { color-scheme: light dark; --line: #8883; --accent: #3b6ea5; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 1.5rem; padding: .8rem 1.2rem; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header .brand { font-weight: 700; text-decoration: none; }
  header nav { display: flex; align-items: center; gap: 1rem; margin-left: auto; }
  header nav a { text-decoration: none; }
  main { max-width: 900px; margin: 0 auto; padding: 1.5rem 1.2rem 4rem; }
  h1 { margin-top: 0; }
  h2 { margin-top: 2rem; }
  a { color: var(--accent); }
  .flash { max-width: 900px; margin: 1rem auto 0; padding: .6rem 1rem; border: 1px solid var(--accent); border-radius: 6px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: .5rem .6rem; border-bottom: 1px solid var(--line); }
  form.inline { display: inline; }
  input, select, button { font: inherit; padding: .4rem .5rem; }
  textarea { font: inherit; padding: .4rem .5rem; width: 100%; }
  .grid-choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: .3rem; margin: .4rem 0; }
  button { cursor: pointer; }
  .field { display: block; margin: .6rem 0; }
  .field span { display: block; font-size: .85rem; color: #8889; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 1rem; margin: 1rem 0; }
  .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
  .thumbs figure { margin: 0; }
  .thumbs img { width: 100%; aspect-ratio: 3/2; object-fit: cover; border-radius: 4px; background: #8882; }
  .thumbs figcaption { font-size: .78rem; color: #8889; margin-top: .25rem; word-break: break-word; }
  .item .fn { display: block; margin-bottom: .3rem; }
  .item.is-cover img { outline: 2px solid var(--accent); outline-offset: 2px; }
  .item form { display: flex; flex-wrap: wrap; gap: .3rem; align-items: center; }
  .item form input[type="text"] { flex: 1 1 100%; }
  .item-actions { display: flex; gap: .3rem; margin-top: .3rem; }
  .item-actions form { display: inline; }
  button.danger { color: #b00; }
  .badge { font-size: .75rem; padding: .1rem .45rem; border: 1px solid var(--line); border-radius: 999px; }
  .progress { height: 8px; background: #8883; border-radius: 4px; overflow: hidden; margin: .5rem 0; }
  .progress-bar { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
</style>
</head>
<body>
<header>
  <a class="brand" href="{{.BasePath}}/">Curator</a>
  <nav>
    <a href="{{.BasePath}}/">Galleries</a>
    <a href="{{.BasePath}}/access">Access</a>
    <a href="{{.BasePath}}/settings">Settings</a>
    <form class="inline" method="post" action="{{.BasePath}}/build"><input type="hidden" name="_csrf" value="{{.CSRF}}"><button>Build site</button></form>
    {{if and .AuthEnabled .Authed}}<form class="inline" method="post" action="{{.BasePath}}/logout"><input type="hidden" name="_csrf" value="{{.CSRF}}"><button>Sign out</button></form>{{end}}
  </nav>
</header>
{{if .Flash}}<div class="flash">{{.Flash}}</div>{{end}}
<main>
{{end}}

{{define "foot"}}</main>
</body>
</html>
{{end}}
