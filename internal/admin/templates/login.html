{{define "login"}}{{template "head" .}}
<div class="page-head">
  <div><h1>Welcome back</h1><p>Sign in to manage Curator.</p></div>
</div>
<form class="card login-card" method="post" action="{{.BasePath}}/login">
  <input type="hidden" name="_csrf" value="{{.CSRF}}">
  <label class="field"><span>Password</span><input type="password" name="password" autofocus required></label>
  <button>Sign in</button>
</form>
{{template "foot" .}}{{end}}
