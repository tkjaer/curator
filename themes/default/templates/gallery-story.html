{{define "gallery-story"}}{{template "site-head" .}}
{{template "breadcrumbs" .Breadcrumb}}
<article class="story">
  <h1>{{.Title}}</h1>
  {{range .Blocks}}
  {{if eq .Type "grid"}}{{template "grid" .Rows}}
  {{else if eq .Type "image"}}<figure class="story-image">
    <a href="{{.Photo.Display.URL}}" data-lightbox data-zoom-src="{{if .Photo.Zoom.URL}}{{.Photo.Zoom.URL}}{{else}}{{.Photo.Display.URL}}{{end}}" data-id="{{.Photo.Slug}}" data-title="{{.Photo.Title}}" data-description="{{.Photo.Description}}" data-caption="{{.Photo.Caption}}"{{with .Photo.Exif}} data-exif="{{.Line}}"{{end}}>
      <img src="{{.Photo.Display.URL}}"
           srcset="{{range $i, $s := .Photo.Srcset}}{{if $i}}, {{end}}{{$s.URL}} {{$s.Width}}w{{end}}"
           sizes="(max-width: 900px) 100vw, 900px"
           width="{{.Photo.Width}}" height="{{.Photo.Height}}" alt="{{.Photo.Alt}}" loading="lazy">
    </a>
    {{if or .Photo.Title .Photo.Description .Photo.Caption}}<figcaption>{{with .Photo.Title}}<span class="fig-title">{{.}}</span>{{end}}{{with .Photo.Description}}<span class="fig-description">{{.}}</span>{{end}}{{with .Photo.Caption}}<span class="fig-caption">{{.}}</span>{{end}}</figcaption>{{end}}
  </figure>
  {{else}}<div class="prose">{{.HTML}}</div>
  {{end}}
  {{end}}
</article>
{{template "site-foot" .}}{{end}}
