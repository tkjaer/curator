{{define "lightbox"}}<dialog id="lightbox" class="lightbox">
  <button class="lb-btn lb-close" aria-label="Close">&times;</button>
  {{if .ShowSharing}}<button class="lb-btn lb-share" type="button" aria-expanded="false" aria-controls="lb-share-panel"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 10.5 6.8-4M8.6 13.5l6.8 4"/></svg><span>Share</span></button>
  <div class="lb-share-panel" id="lb-share-panel" role="menu" aria-label="Share photo" hidden>
    <div class="lb-share-heading"><strong>Share photo</strong><button type="button" data-share-close aria-label="Close sharing menu"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="lb-share-actions">
      <button type="button" role="menuitem" data-share-action="system" hidden><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 10.5 6.8-4M8.6 13.5l6.8 4"/></svg><span>Share&hellip;</span></button>
      <button type="button" role="menuitem" data-share-action="link"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.1.1l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1M14 11a5 5 0 0 0-7.1-.1l-2 2A5 5 0 0 0 12 20l1.1-1.1"/></svg><span>Copy link</span></button>
      <button type="button" role="menuitem" data-share-action="markdown"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"/><path d="M6 15V9l3 3 3-3v6M16 9v6m-2-2 2 2 2-2"/></svg><span>Copy Markdown</span></button>
      <button type="button" role="menuitem" data-share-action="html"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m8 9-4 3 4 3M16 9l4 3-4 3M14 5l-4 14"/></svg><span>Copy HTML</span></button>
    </div>
    <p class="lb-share-status" role="status" aria-live="polite"></p>
  </div>{{end}}
  <button class="lb-btn lb-prev" aria-label="Previous">&#8249;</button>
  <button class="lb-image-button" type="button" aria-label="View image at actual size"><img class="lb-img" alt=""></button>
  <button class="lb-btn lb-next" aria-label="Next">&#8250;</button>
  <div class="lb-details">
    <div class="lb-tags" aria-label="Photo tags"></div>
    <p class="lb-caption"></p>
    <p class="lb-exif"></p>
  </div>
</dialog>{{end}}
