{{define "lightbox"}}<dialog id="lightbox" class="lightbox">
  <button class="lb-btn lb-close" aria-label="Close">&times;</button>
  <button class="lb-btn lb-prev" aria-label="Previous">&#8249;</button>
  <button class="lb-image-button" type="button" aria-label="View image at actual size"><img class="lb-img" alt=""></button>
  <button class="lb-btn lb-next" aria-label="Next">&#8250;</button>
  <div class="lb-details">
    <div class="lb-tags" aria-label="Photo tags"></div>
    <p class="lb-caption"></p>
    <p class="lb-exif"></p>
  </div>
</dialog>{{end}}
